name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run: builds and uploads the APK as a workflow artifact only (no release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository does not ship a Gradle wrapper, so pin the Gradle version here.
      # AGP 8.5.2 requires Gradle 8.7 or newer.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="${TAG#v}"
            CORE="${NAME%%-*}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${CORE}"
            # versionCode = MAJOR * 10000 + MINOR * 100 + PATCH
            CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))
          else
            TAG="dev-${GITHUB_RUN_NUMBER}"
            NAME="0.0.0-dev"
            CODE=1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      # If signing secrets are not configured, fall back to a debug build.
      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set. Building a debug-signed APK instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          gradle "${TASK}" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect release files
        run: |
          mkdir -p dist
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
              "dist/Bridge-${{ steps.version.outputs.tag }}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              "dist/Bridge-${{ steps.version.outputs.tag }}-debug.apk"
          fi
          cp linux/bridge_daemon.py dist/bridge_daemon.py
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=(--generate-notes)
          # Tags like v0.2.0-beta1 are published as pre-releases
          if [[ "${{ steps.version.outputs.name }}" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            "${FLAGS[@]}"
